<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta http-equiv="Content-Style-Type" content="text/css" />
        <link rel="stylesheet" type="text/css" href="style.css" media="screen" />
<script type="text/javascript">
function b(tag)
 {
  	return document.getElementById(tag);
  }
  
  function alertBeep(){
	  b('beep_general').play(1);
	  b('beep_general').volume(200);
	 }
</script>
</head>
<body>
<object id="beep_general" type="application/x-shockwave-flash" data="flashbeep_general.swf" width="1" height="1">
	<param name="movie" value="flashbeep_general.swf" />
	<param name="FlashVars" value="onLoad=isReady" />
</object> 
</body>
	<input type="button" onclick="alertBeep()" />
</html>
